<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="static/css/app.css?v=1.0.0">
    <link rel="stylesheet" href="static/style.css?v=1.0.1">
    <script src="static/app.js?v=1.0.3"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"
        integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb"
        crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="bookmarkApp">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <!-- Top row: brand + add URL -->
            <div class="flex items-center gap-4 py-3">
                <h1 class="text-lg font-bold text-gray-900 tracking-tight flex items-center gap-2 shrink-0">
                    <svg class="w-5 h-5 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                    Bookmarks
                </h1>
                <form @submit.prevent="addBookmark()" class="flex-1 flex gap-2 max-w-3xl">
                    <div class="relative flex-1">
                        <input type="text" x-model="newUrl" required
                            placeholder="Paste any URL to save..."
                            class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent focus:bg-white transition"
                            :disabled="adding">
                        <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                    </div>
                    <button type="submit" :disabled="adding"
                        class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-semibold hover:bg-brand-700 disabled:opacity-60 transition-all flex items-center gap-2 shrink-0 shadow-sm">
                        <svg x-show="adding" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        <svg x-show="!adding" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span class="hidden sm:inline" x-text="adding ? 'Saving...' : 'Save'"></span>
                    </button>
                </form>
                <a href="https://lab.kudithipudi.org/" class="hidden md:inline text-xs text-gray-400 hover:text-brand-600 shrink-0 ml-auto transition">&larr; lab.kudithipudi.org</a>
            </div>
            <!-- Adding status hint -->
            <div x-show="adding" class="pb-2 -mt-1 pl-1">
                <p class="text-xs text-brand-600 flex items-center gap-1.5">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span>
                    Fetching page and generating tags — this takes a few seconds...
                </p>
            </div>
            <!-- Bottom row: search + active filter -->
            <div class="flex items-center gap-3 pb-3" x-show="!adding">
                <div class="relative flex-1 max-w-sm">
                    <input type="text" x-model="searchQuery" @input.debounce.300ms="loadBookmarks()"
                        placeholder="Search bookmarks..."
                        class="w-full pl-9 pr-4 py-1.5 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    <svg class="absolute left-3 top-2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <button x-show="searchQuery" @click="searchQuery = ''; loadBookmarks()"
                        class="absolute right-3 top-2 w-4 h-4 text-gray-400 hover:text-gray-600">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <template x-if="activeTag">
                    <span class="flex items-center gap-1.5 px-2.5 py-1 bg-brand-50 text-brand-700 border border-brand-200 rounded-lg text-xs font-medium">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                        <span x-text="activeTag"></span>
                        <button @click="activeTag = ''; loadBookmarks()" class="ml-0.5 hover:text-brand-900 text-base leading-none">&times;</button>
                    </span>
                </template>
                <span class="ml-auto text-xs text-gray-400" x-show="!loading" x-text="bookmarks.length + (bookmarks.length === 1 ? ' bookmark' : ' bookmarks')"></span>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex gap-6">

        <!-- Sidebar: Tags -->
        <aside class="hidden lg:block w-52 shrink-0">
            <div class="sticky top-28">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Filter by tag</p>
                <button @click="activeTag = ''; loadBookmarks()"
                    :class="!activeTag ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'"
                    class="w-full text-left px-3 py-1.5 rounded-lg text-sm mb-0.5 transition flex items-center justify-between">
                    <span>All bookmarks</span>
                    <span class="text-xs" :class="!activeTag ? 'text-brand-500' : 'text-gray-400'" x-text="tags.reduce((a, t) => a + t.count, 0) || ''"></span>
                </button>
                <div class="mt-1 space-y-0.5">
                    <template x-for="t in tags" :key="t.tag">
                        <button @click="activeTag = t.tag; loadBookmarks()"
                            :class="activeTag === t.tag ? 'bg-brand-50 text-brand-700 font-semibold' : 'text-gray-600 hover:bg-gray-100'"
                            class="w-full text-left px-3 py-1.5 rounded-lg text-sm flex justify-between items-center transition">
                            <span x-text="t.tag"></span>
                            <span class="text-xs" :class="activeTag === t.tag ? 'text-brand-500' : 'text-gray-400'" x-text="t.count"></span>
                        </button>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="flex-1 min-w-0">

            <!-- Mobile tag pills -->
            <div class="lg:hidden mb-4 flex flex-wrap gap-1.5">
                <button @click="activeTag = ''; loadBookmarks()"
                    :class="!activeTag ? 'bg-brand-600 text-white' : 'bg-gray-200 text-gray-700'"
                    class="px-2.5 py-1 rounded-full text-xs font-medium transition">All</button>
                <template x-for="t in tags" :key="'m-'+t.tag">
                    <button @click="activeTag = t.tag; loadBookmarks()"
                        :class="activeTag === t.tag ? 'bg-brand-600 text-white' : 'bg-gray-200 text-gray-700'"
                        class="px-2.5 py-1 rounded-full text-xs font-medium transition"
                        x-text="t.tag"></button>
                </template>
            </div>

            <!-- Loading skeleton -->
            <div x-show="loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <template x-for="i in [1,2,3,4,5,6]" :key="i">
                    <div class="bg-white rounded-xl border border-gray-100 p-4 animate-pulse">
                        <div class="flex gap-3 mb-3">
                            <div class="w-5 h-5 bg-gray-200 rounded shrink-0 mt-0.5"></div>
                            <div class="flex-1">
                                <div class="h-3.5 bg-gray-200 rounded w-3/4 mb-1.5"></div>
                                <div class="h-3 bg-gray-100 rounded w-1/3"></div>
                            </div>
                        </div>
                        <div class="h-3 bg-gray-100 rounded w-full mb-1.5"></div>
                        <div class="h-3 bg-gray-100 rounded w-5/6"></div>
                    </div>
                </template>
            </div>

            <!-- Empty state -->
            <div x-show="!loading && bookmarks.length === 0" class="text-center py-20">
                <svg class="w-14 h-14 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                <p class="text-gray-500 font-medium">No bookmarks found</p>
                <p class="text-gray-400 text-sm mt-1" x-text="searchQuery || activeTag ? 'Try a different search or tag' : 'Paste a URL above to get started'"></p>
            </div>

            <!-- Bookmark grid -->
            <div x-show="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <template x-for="bm in bookmarks" :key="bm.id">
                    <div class="bg-white rounded-xl border border-gray-200 p-4 hover:border-gray-300 hover:shadow-md transition-all duration-200 flex flex-col">

                        <!-- Edit mode -->
                        <div x-show="editingId === bm.id" x-cloak class="flex flex-col gap-2 flex-1">
                            <input type="text" x-model="editForm.title" placeholder="Title"
                                class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition">
                            <textarea x-model="editForm.description" placeholder="Description" rows="2"
                                class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition resize-none"></textarea>
                            <input type="text" x-model="editForm.tags" placeholder="Tags (comma-separated)"
                                class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition">
                            <div class="flex gap-2 mt-1">
                                <button @click="saveEdit(bm.id)" class="px-4 py-1.5 bg-brand-600 text-white rounded-lg text-xs font-semibold hover:bg-brand-700 transition">Save</button>
                                <button @click="editingId = null" class="px-4 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-xs font-semibold hover:bg-gray-200 transition">Cancel</button>
                            </div>
                        </div>

                        <!-- View mode -->
                        <div x-show="editingId !== bm.id" class="flex flex-col flex-1">
                            <!-- Title + favicon -->
                            <div class="flex items-start gap-2.5 mb-2">
                                <img :src="bm.favicon || 'https://www.google.com/s2/favicons?domain=' + new URL(bm.url).hostname + '&sz=32'"
                                    class="w-5 h-5 mt-0.5 rounded-sm shrink-0 object-contain" @error="$el.style.display='none'">
                                <div class="min-w-0 flex-1">
                                    <a :href="bm.url" target="_blank" rel="noopener"
                                        class="text-sm font-semibold text-gray-900 hover:text-brand-600 line-clamp-1 block leading-snug"
                                        x-text="bm.title || bm.url"></a>
                                    <p class="text-xs text-gray-400 truncate mt-0.5" x-text="new URL(bm.url).hostname"></p>
                                </div>
                            </div>

                            <!-- Description -->
                            <p x-show="bm.description"
                                class="text-sm text-gray-500 line-clamp-2 mb-3 leading-relaxed flex-1"
                                x-text="bm.description"></p>
                            <div x-show="!bm.description" class="flex-1"></div>

                            <!-- Tags -->
                            <div class="flex flex-wrap gap-1 mb-3" x-show="bm.tags">
                                <template x-for="tag in bm.tags.split(',').filter(t => t.trim())" :key="tag">
                                    <button @click="activeTag = tag.trim(); loadBookmarks()"
                                        class="px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full text-xs hover:bg-brand-50 hover:text-brand-700 transition font-medium"
                                        x-text="tag.trim()"></button>
                                </template>
                            </div>

                            <!-- Actions — always visible -->
                            <div class="flex items-center gap-1 pt-2 border-t border-gray-100 -mx-1">
                                <button @click="startEdit(bm)"
                                    class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-gray-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition font-medium">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    Edit
                                </button>
                                <button @click="openDeleteModal(bm.id)"
                                    class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition font-medium">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    Delete
                                </button>
                                <a :href="bm.url" target="_blank" rel="noopener"
                                    class="ml-auto flex items-center gap-1 px-2.5 py-1.5 text-xs text-gray-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition font-medium">
                                    Open
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                </a>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center">
        <p class="text-xs text-gray-400">Part of the <a href="https://lab.kudithipudi.org/" class="hover:text-brand-600 underline">Kudithipudi AI Lab</a></p>
    </footer>

    <!-- Delete modal -->
    <div x-show="deleteModal.open" x-cloak
        class="fixed inset-0 z-50 flex items-center justify-center p-4"
        @keydown.escape.window="deleteModal.open = false">

        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="deleteModal.open = false"></div>

        <!-- Modal -->
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 flex flex-col gap-4"
            @click.stop x-trap.noscroll="deleteModal.open">
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </div>
                <div>
                    <h2 class="text-base font-semibold text-gray-900">Delete bookmark?</h2>
                    <p class="text-sm text-gray-500 mt-0.5">This can't be undone. Enter your password to confirm.</p>
                </div>
            </div>

            <input type="password" x-model="deleteModal.password"
                placeholder="Password"
                @keydown.enter="confirmDelete()"
                x-ref="deletePasswordInput"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent bg-gray-50 focus:bg-white transition">

            <p x-show="deleteModal.error" class="text-xs text-red-600 -mt-2" x-text="deleteModal.error"></p>

            <div class="flex gap-2">
                <button @click="deleteModal.open = false"
                    class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
                    Cancel
                </button>
                <button @click="confirmDelete()" :disabled="!deleteModal.password"
                    class="flex-1 px-4 py-2.5 bg-red-600 text-white rounded-lg text-sm font-semibold hover:bg-red-700 disabled:opacity-50 transition">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.msg" x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        :class="toast.type === 'error' ? 'bg-red-700' : 'bg-gray-900'"
        class="fixed bottom-6 right-6 text-white px-4 py-2.5 rounded-xl text-sm shadow-xl z-50 flex items-center gap-2" x-cloak>
        <svg x-show="toast.type === 'error'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <svg x-show="toast.type !== 'error'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        <span x-text="toast.msg"></span>
    </div>

</body>
</html>
